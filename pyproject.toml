[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-credit-geometry"
version = "1.0.0"
description = "ICASSP 2027 reviewer-facing reproducibility artifact"
requires-python = ">=3.12"
dependencies = [
  "torch==2.8.0",
  "numpy==2.3.2",
  "PyYAML==6.0.2",
  "h5py==3.16.0",
  "pandas==3.0.5",
  "matplotlib==3.10.5",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["analysis*", "evaluation*", "methods*", "models*", "training*"]
