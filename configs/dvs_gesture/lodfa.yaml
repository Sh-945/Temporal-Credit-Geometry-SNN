experiment:
  name: dvs_gesture_convsmall_lodfa
  seed: 42
data:
  dataset: dvs_gesture
  root: ../data
  time_steps: 30
  batch_size: 16
  num_workers: 0
model:
  architecture: convsmall
  input_shape: [2, 128, 128]
  channels: [32, 64]
  hidden_features: 256
  pool: 2
  num_classes: 11
neuron:
  type: lif
  decay: 0.5
  threshold: 1.0
  surrogate_beta: 10.0
method:
  name: lodfa
  local_loss: proxy
  temporal_mode: pointwise
  local_weight: 1.0
  feedback:
    rank: 7
    layer_ranks: null
    rank_fraction: null
    trainable: true
    scale: 1.0
    loss_weights:
      alignment: 0.001
      orthogonal: 0.0001
      hoyer: 0.00001
    dynamic_rank:
      enabled: true
      warmup_epochs: 10
      update_interval: 5
      energy_threshold: 0.95
      minimum_rank: 1
training:
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip: 1.0
  lr_step: 60
  lr_gamma: 0.1
  output_dir: outputs/dvs_gesture/lodfa_seed42
