experiment:
  name: nmnist_4fc_sdfa_feedback_subspace
  seed: 20260830
data:
  dataset: nmnist
  root: ../data
  time_steps: 30
  batch_size: 128
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
model:
  architecture: fc
  input_shape: [2, 34, 34]
  hidden_features: [800, 800, 800]
  num_classes: 10
neuron:
  type: lif
  decay: 0.5
  threshold: 1.0
  surrogate_beta: 10.0
method:
  name: sdfa
  local_loss: proxy
  temporal_mode: pointwise
  local_weight: 1.0
  feedback:
    scale: 1.0
training:
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip: 1.0
  lr_step: 60
  lr_gamma: 0.1
  checkpoint_epochs: [10, 25, 50, 75, 100]
  output_dir: outputs/nmnist/feedback_subspace_seed20260830
diagnostic:
  probe_size: 2048
  probe_seed: 20260830
  shuffled_label_seed: 20260902
  batch_size: 128
  preload_dataset: true
